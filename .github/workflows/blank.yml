name: Build Mahmoud Keyboard

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: بناء التطبيق
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: MahmoudKeyboard-APK
          path: '**/build/outputs/apk/debug/*.apk'
